<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quiz | Cellive Skin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <!-- Fonte oficial: Acumin Pro e Acumin Pro Condensed (Adobe Fonts) -->
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/zvs4xwq.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="quiz">

    <header class="quiz-top">
      <button class="quiz-back" type="button" aria-label="Voltar" data-back>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </button>
      <a class="brand" href="./" aria-label="Cellive Skin">
        <img src="assets/img/logo-cellive-skin.svg" alt="Cellive Skin" width="157" height="18">
      </a>
    </header>

    <!-- Progresso: 1, 2, 3 -->
    <ol class="stepper" data-stepper></ol>

    <!-- Pergunta atual (montada pelo assets/js/quiz.js) -->
    <section class="quiz-screen" data-screen aria-live="polite"></section>

    <noscript>
      <p class="quiz-note">Para responder ao quiz, ative o JavaScript do seu navegador.</p>
    </noscript>

  </main>

  <script src="assets/js/quiz-perguntas.js"></script>
  <script src="assets/js/quiz.js"></script>
</body>
</html>
