  <!-- A fonte da Adobe não trava mais a primeira tela: o CSS dela é lido em segundo plano e
       ganha font-display: swap (o texto aparece na hora, na fonte de reserva do mesmo tamanho,
       e troca para a Acumin quando ela chega). O contador da Adobe (p.typekit.net) continua. -->
  <script>
    (function () {
      var u = "https://use.typekit.net/zvs4xwq.css";
      var usarLink = function () { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); };
      try {
        fetch(u).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (css) {
          var s = document.createElement("style");
          s.textContent = css.replace(/font-display:\s*auto/g, "font-display:swap");
          document.head.appendChild(s);
        }).catch(usarLink);
      } catch (e) { usarLink(); }
    })();
  </script>
